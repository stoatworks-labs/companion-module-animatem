name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# This module is TypeScript, unlike its siblings, so the check has more to say:
# typecheck catches a bump that changes @companion-module/base's types without
# changing its behaviour, which no runtime test would notice.
#
# Lint and package were left out when this workflow was written, because both
# were red on main and gating every Dependabot bump on a pre-existing failure
# would have blocked the very PRs the workflow exists to unblock. Both are
# fixed now and both are checked here:
#
#   npm run lint     The 43 prettier findings were all in the vendored About
#                    block, which is tab-indented and not this repo's to
#                    reformat — eslint.config.mjs and .prettierignore now leave
#                    it to its master in stoatworks-backend. The
#                    n/no-missing-import is disabled at the one import it is
#                    wrong about, with the reason at the line.
#   npm run package  src/about-field.js is hand-written JavaScript vendored
#                    with a .d.ts beside it, and tsconfig.build.json included
#                    only src/**/*.ts — so it never reached dist/ and esbuild
#                    could not resolve dist/config.js's import of it. allowJs
#                    plus src/**/*.js in the include now emits it. Packaging is
#                    what a release actually ships, so it is worth a check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `main` is dist/main.js, so the TypeScript has to compile before anything
      # downstream can use it — including the packaging step below.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The .tgz is what a release ships, and it is built by esbuild bundling
      # dist/ — a different resolver from tsc, with its own ways to fail. Only
      # this step would have caught the missing about-field.js.
      - name: Build module package
        run: npm run package
