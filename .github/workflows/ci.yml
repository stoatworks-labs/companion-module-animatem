name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# This module is TypeScript, unlike its siblings, so the check has more to say:
# typecheck catches a bump that changes @companion-module/base's types without
# changing its behaviour, which no runtime test would notice.
#
# Two steps its siblings have are deliberately absent, both because they are
# already red on main and gating every bump on a pre-existing failure would
# block the very PRs this workflow exists to unblock:
#
#   npm run lint     43 prettier/prettier findings, plus an n/no-missing-import
#                    on the TS-style './about-field.js' specifier.
#   npm run package  src/about-field.js is hand-written JavaScript with a .d.ts
#                    beside it, and tsconfig.build.json includes only
#                    src/**/*.ts — so it is never emitted to dist/ and esbuild
#                    cannot resolve dist/config.js's import of it. release.yml
#                    hits the same wall (and does not even build first), so
#                    this module cannot currently be packaged from a clean
#                    checkout. Tracked separately; add the step once it is
#                    fixed, because packaging is what a release actually ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `main` is dist/main.js, so the TypeScript has to compile before anything
      # downstream can use it. This is also the step release.yml is missing.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
