name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# This module is TypeScript, unlike its siblings, so the check has more to say:
# typecheck catches a bump that changes @companion-module/base's types without
# changing its behaviour, which no runtime test would notice.
#
# Two steps its siblings have are deliberately absent, both because they are
# already red on main and gating every bump on a pre-existing failure would
# block the very PRs this workflow exists to unblock:
#
#   npm run lint     43 prettier/prettier findings, plus an n/no-missing-import
#                    on the TS-style './about-field.js' specifier.
# (`npm run package` used to be absent for the same reason — it could not resolve
# dist/config.js's import of the hand-written src/about-field.js. It packages
# cleanly now, as long as Build runs first, so it is back: packaging is what a
# release actually ships, and it is the step that has actually broken.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `main` is dist/main.js, so the TypeScript has to compile before anything
      # downstream can use it. release.yml compiles first for the same reason.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build module package
        run: npm run package

      # Packaging succeeding is not the same as the package being loadable. What
      # Companion (and Burrow) look for is package.json in the archive's root
      # directory, and release.yml once shipped an archive that had it a level
      # deeper. Assert the shape here, where a PR can go red for it.
      - name: Check the package is loadable
        shell: bash
        run: |
          set -euo pipefail
          f=$(ls -1 *.tgz 2>/dev/null | head -n 1 || true)
          [ -n "$f" ] || { echo "::error::companion-module-build produced no .tgz"; exit 1; }
          root=$(tar tzf "$f" | head -n 1 | cut -d/ -f1)
          for want in "$root/package.json" "$root/companion/manifest.json"; do
            tar tzf "$f" | grep -qx "$want" \
              || { echo "::error::$f has no $want, so Companion would not load it"; exit 1; }
          done
          echo "$f: ok — root is $root/"
